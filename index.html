<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menu</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      overflow: hidden; background: #333;
      font-family: system-ui, sans-serif;
    }
    #toolbar {
      position: fixed; z-index: 10; top: 10px; right: 10px;
      display: flex; gap: 6px;
      background: rgba(0,0,0,.65); padding: 6px; border-radius: 10px;
    }
    button {
      border: 0; border-radius: 7px; background: white;
      width: 40px; height: 36px; font-size: 20px;
    }
    #viewer {
      width: 100%; height: 100%; overflow: auto;
      -webkit-overflow-scrolling: touch;
      display: flex; justify-content: center; align-items: flex-start;
    }
    #pageWrap { flex: 0 0 auto; }
    canvas {
      display: block; background: white;
      box-shadow: 0 1px 8px rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="minus" aria-label="Zoom out">−</button>
    <button id="plus" aria-label="Zoom in">+</button>
  </div>
  <div id="viewer"><div id="pageWrap"><canvas id="page"></canvas></div></div>

  <script type="module">
    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const viewer = document.getElementById("viewer");
    const canvas = document.getElementById("page");
    const ctx = canvas.getContext("2d", { alpha: false });

    let pdf, page;
    let zoom = 1;
    let baseScale = 1;

    async function init() {
      pdf = await pdfjsLib.getDocument("menu-en.pdf").promise;
      page = await pdf.getPage(1);
      fitToWidth();
    }

    function fitToWidth() {
      const v = page.getViewport({ scale: 1 });
      baseScale = viewer.clientWidth / v.width;
      zoom = 1;
      render();
    }

    async function render() {
      const cssScale = baseScale * zoom;
      const viewport = page.getViewport({ scale: cssScale });

      // Render at a higher pixel density than the CSS size.
      // This keeps text much sharper on Retina/HiDPI phones.
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      canvas.width = Math.ceil(viewport.width * dpr);
      canvas.height = Math.ceil(viewport.height * dpr);
      canvas.style.width = `${viewport.width}px`;
      canvas.style.height = `${viewport.height}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    document.getElementById("plus").onclick = () => {
      zoom = Math.min(zoom * 1.25, 5);
      render();
    };

    document.getElementById("minus").onclick = () => {
      zoom = Math.max(zoom / 1.25, 0.5);
      render();
    };

    window.addEventListener("resize", () => {
      if (zoom === 1) fitToWidth();
    });

    init();
  </script>
</body>
</html>
